# CI Mbolo Santé — contrôles obligatoires avant fusion dans main.
# Aucun secret n'est utilisé par ce workflow ; aucune donnée réelle.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  securite:
    name: Sécurité (gitleaks + contrôles pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          # La règle « pas de commit sur main » n'a pas de sens en CI (elle s'exécute après fusion).
          SKIP: no-commit-to-branch
      - name: gitleaks sur tout l'historique
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  dependances:
    name: Dépendances (vulnérabilités connues)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Ce qui est livré (dépendances de production) : aucune faille haute ou critique connue.
      - name: Dépendances livrées (faille haute ou critique bloquante)
        run: pnpm audit --prod --audit-level high
      # Outils de développement et de test : aucune faille critique connue.
      - name: Toutes les dépendances (faille critique bloquante)
        run: pnpm audit --audit-level critical

  revue-dependances:
    name: Revue des dépendances ajoutées
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Une dépendance ajoutée ou mise à jour avec une faille haute ou critique connue est refusée.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  skills:
    name: Conformité des skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/verifier_skills.py .

  code:
    name: Code (format, lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: PostgreSQL de test (base des services, ADR-0013)
        run: bash scripts/postgres-test.sh
      - run: pnpm test

  fhir:
    name: FHIR (profils, exemples fictifs, garde-fous)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache du validateur et des paquets FHIR
        uses: actions/cache@v4
        with:
          path: |
            platform/services/dossier-fhir/.cache
            ~/.fhir/packages
          key: fhir-${{ hashFiles('platform/services/dossier-fhir/ig/sushi-config.yaml') }}
      - run: bash platform/services/dossier-fhir/scripts/valider-ig.sh

  e2e:
    name: E2E (Keycloak + identité, comptes fictifs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Navigateur Chromium pour Playwright
        run: pnpm --filter @mbolo/e2e exec playwright install --with-deps chromium
      - name: Secrets de test éphémères (générés, masqués, jamais conservés)
        run: |
          MDP="$(openssl rand -hex 24)"
          echo "::add-mask::$MDP"
          echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$MDP" >> "$GITHUB_ENV"
          SECRET_SERVICE="$(openssl rand -hex 24)"
          echo "::add-mask::$SECRET_SERVICE"
          echo "IDENTITE_SERVICE_CLIENT_SECRET=$SECRET_SERVICE" >> "$GITHUB_ENV"
          for NOM in UNLEASH_DB_PASSWORD UNLEASH_ADMIN_TOKEN UNLEASH_BACKEND_TOKEN WEBRTC_API_SECRET TELECONSULTATION_SERVICE_CLIENT_SECRET NOTIFICATIONS_SERVICE_CLIENT_SECRET CONSULTATION_SERVICE_CLIENT_SECRET; do
            VALEUR="$(openssl rand -hex 24)"
            echo "::add-mask::$VALEUR"
            case "$NOM" in
              UNLEASH_ADMIN_TOKEN) VALEUR="*:*.$VALEUR" ;;
              UNLEASH_BACKEND_TOKEN) VALEUR="default:development.$VALEUR" ;;
            esac
            echo "$NOM=$VALEUR" >> "$GITHUB_ENV"
          done
          echo "WEBRTC_API_KEY=mbolo-ci-$(openssl rand -hex 6)" >> "$GITHUB_ENV"
      - name: PostgreSQL de test (invitations, ADR-0013)
        run: bash scripts/postgres-test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Extension Keycloak d'inscription (compilation et tests, ADR-0014)
        run: mvn -B -q -f platform/services/identite/keycloak-extension/pom.xml package
      - name: Démarrer Keycloak (royaume mbolo)
        run: docker compose -f platform/services/identite/docker-compose.yml up -d
      - name: Démarrer HAPI FHIR (données fictives, effacées à l'arrêt)
        run: docker compose -f platform/services/dossier-fhir/docker-compose.yml up -d
      - name: Démarrer Unleash (feature flags de test)
        run: docker compose -f platform/services/feature-flags/docker-compose.yml up -d
      - name: Démarrer LiveKit (téléconsultation, version et empreinte vérifiées)
        env:
          LIVEKIT_VERSION: 1.12.0
          LIVEKIT_SHA256: 9b89eb169c6c5795393bad6b52a9d0c73640a5993b37162558b4e249e5fe3aee
        run: |
          curl -sSL -o livekit.tgz "https://github.com/livekit/livekit/releases/download/v$LIVEKIT_VERSION/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          echo "$LIVEKIT_SHA256  livekit.tgz" | sha256sum -c -
          tar xzf livekit.tgz livekit-server
          LIVEKIT_KEYS="$WEBRTC_API_KEY: $WEBRTC_API_SECRET" nohup ./livekit-server --config platform/services/teleconsultation/livekit/config-local.yaml > livekit.log 2>&1 &
      - name: Attendre Keycloak
        run: timeout 180 bash -c 'until curl -sf http://127.0.0.1:8081/realms/mbolo/.well-known/openid-configuration > /dev/null; do sleep 3; done'
      - name: Attendre HAPI FHIR
        run: timeout 300 bash -c 'until curl -sf http://127.0.0.1:8080/fhir/metadata > /dev/null; do sleep 5; done'
      - name: Attendre Unleash
        run: timeout 180 bash -c 'until curl -sf http://127.0.0.1:4242/health > /dev/null; do sleep 3; done'
      - name: Attendre LiveKit
        run: timeout 60 bash -c 'until curl -sf http://127.0.0.1:7880 > /dev/null; do sleep 2; done'
      - run: pnpm e2e
        env:
          # Keycloak (conteneur) joint le service des invitations par la passerelle Docker.
          INVITATIONS_HOST: 0.0.0.0
      - name: Journaux Keycloak, HAPI, Unleash et LiveKit en cas d'échec
        if: failure()
        run: |
          docker compose -f platform/services/identite/docker-compose.yml logs --tail 200
          docker compose -f platform/services/dossier-fhir/docker-compose.yml logs --tail 200
          docker compose -f platform/services/feature-flags/docker-compose.yml logs --tail 100
          tail -n 100 livekit.log || true
