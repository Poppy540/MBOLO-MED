# Analyse statique du code (SAST) par GitHub CodeQL — skill scans-securite.
# Cherche les failles connues (injections, fuites de données, chemins non contrôlés…) dans le code
# TypeScript et JavaScript. Les alertes apparaissent dans l'onglet « Security » du dépôt.
# Aucun secret utilisé ; le code analysé ne contient que des données fictives.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Chaque lundi : de nouvelles règles peuvent révéler des failles dans du code inchangé.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse du code (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Règles de sécurité étendues (au-delà du jeu par défaut).
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
