# Serveur FHIR local pour le développement — DONNÉES FICTIVES UNIQUEMENT.
# Lancement : docker compose -f platform/services/dossier-fhir/docker-compose.yml up -d
# Base H2 en mémoire : tout est effacé à l'arrêt. Aucun port exposé hors de la machine locale.
services:
  hapi-fhir:
    image: hapiproject/hapi:v8.12.0-2
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.cors.allowed_origin: "http://localhost:*"
