# Thème de connexion Mbolo Santé : les gabarits de Keycloak (keycloak.v2), avec le champ
# « code d'invitation » à l'inscription et les pages propres à Mbolo Santé.
parent=keycloak.v2
import=common/keycloak
# Faible débit : ni PatternFly (1,7 Mo), ni image de fond, ni polices téléchargées. Une seule feuille
# légère (resources/css/mbolo.css) met en forme les classes produites par les gabarits.
stylesCommon=
styles=css/mbolo.css
# Mode clair seulement : la feuille légère n'a pas de variante sombre.
darkMode=false
