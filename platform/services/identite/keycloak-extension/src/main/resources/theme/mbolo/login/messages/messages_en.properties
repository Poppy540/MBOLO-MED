# Conditions d''utilisation du proche : même texte que messages_fr.properties (français d''abord).
termsTitle=Conditions d''utilisation pour les proches
termsText=<p>Un patient vous a invité à l''aider à suivre son traitement. Avant d''accéder à ses informations, lisez et acceptez ces conditions.</p><ol><li><strong>Ce que vous voyez</strong> : ses ordonnances et les consignes de son médecin (« Ce qu''il faut faire »), jamais le reste de son dossier.</li><li><strong>Usage personnel</strong> : ces informations servent seulement à aider le patient. Ne les copiez pas, ne les photographiez pas et ne les transmettez à personne.</li><li><strong>Votre compte</strong> : il est personnel. Ne donnez ni votre mot de passe ni vos codes de connexion.</li><li><strong>Transparence</strong> : chaque fois que vous consultez ces informations, c''est enregistré, et le patient peut le voir.</li><li><strong>Accès retiré</strong> : le patient peut retirer votre accès à tout moment, sans avoir à se justifier. L''équipe Mbolo Santé peut aussi le faire à sa demande.</li><li><strong>Urgence</strong> : Mbolo Santé n''est pas un service d''urgence. En cas d''urgence, appelez les secours.</li></ol><p><small>Conditions d''utilisation pour les proches, version c-utilisation-proche-v0.1 (brouillon).</small></p>
