# Keycloak local pour le développement — COMPTES FICTIFS UNIQUEMENT.
# Lancement : KC_BOOTSTRAP_ADMIN_PASSWORD=<local> IDENTITE_SERVICE_CLIENT_SECRET=<local> TELECONSULTATION_SERVICE_CLIENT_SECRET=<local> NOTIFICATIONS_SERVICE_CLIENT_SECRET=<local> CONSULTATION_SERVICE_CLIENT_SECRET=<local> docker compose -f platform/services/identite/docker-compose.yml up -d
# Le mot de passe administrateur n'est jamais écrit dans le dépôt : il est lu dans l'environnement du poste.
# Console : http://127.0.0.1:8081 (accessible uniquement depuis la machine locale).
services:
  keycloak:
    # Version exacte : l'extension d'inscription (keycloak-extension/) est compilée pour elle.
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Définir KC_BOOTSTRAP_ADMIN_PASSWORD dans l'environnement local}
      # Secret du compte de service de identite, injecté dans le royaume à l'import (${…} dans realm-mbolo.json).
      IDENTITE_SERVICE_CLIENT_SECRET: ${IDENTITE_SERVICE_CLIENT_SECRET:?Définir IDENTITE_SERVICE_CLIENT_SECRET dans l'environnement local}
      # Obligatoire : sans valeur, Keycloak garderait le texte « ${…} » comme secret (devinable).
      TELECONSULTATION_SERVICE_CLIENT_SECRET: ${TELECONSULTATION_SERVICE_CLIENT_SECRET:?Définir TELECONSULTATION_SERVICE_CLIENT_SECRET dans l'environnement local}
      NOTIFICATIONS_SERVICE_CLIENT_SECRET: ${NOTIFICATIONS_SERVICE_CLIENT_SECRET:?Définir NOTIFICATIONS_SERVICE_CLIENT_SECRET dans l'environnement local}
      CONSULTATION_SERVICE_CLIENT_SECRET: ${CONSULTATION_SERVICE_CLIENT_SECRET:?Définir CONSULTATION_SERVICE_CLIENT_SECRET dans l'environnement local}
      # Extension d'inscription (ADR-0014) : adresse du service des invitations, vue depuis le conteneur.
      KC_SPI_FORM_ACTION_MBOLO_CODE_INVITATION_INVITATIONS_URL: ${INVITATIONS_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3006/}
      # Identité saisie après l'inscription : dossier créé par la passerelle (ADR-0014).
      KC_SPI_REQUIRED_ACTION_MBOLO_IDENTITE_PATIENT_DOSSIER_URL: ${PASSERELLE_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3002/fhir/}
      KC_SPI_REQUIRED_ACTION_MBOLO_IDENTITE_PATIENT_ENVIRONNEMENT: dev
      # Système du numéro d'assurance maladie nationale du pays déployé (Gabon : CNAMGS) [FICTIF en dev].
      KC_SPI_REQUIRED_ACTION_MBOLO_IDENTITE_PATIENT_IDENTIFIANT_ASSURANCE_SYSTEME: ${IDENTIFIANT_ASSURANCE_SYSTEME:-https://mbolo-sante.example/fhir/identifiant/ga/assurance-maladie}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./keycloak/realm-mbolo.json:/opt/keycloak/data/import/realm-mbolo.json:ro
      # Construire d'abord : mvn -f platform/services/identite/keycloak-extension/pom.xml package
      - ./keycloak-extension/target/mbolo-keycloak-inscription.jar:/opt/keycloak/providers/mbolo-keycloak-inscription.jar:ro
