# Keycloak local pour le développement — COMPTES FICTIFS UNIQUEMENT.
# Lancement : KC_BOOTSTRAP_ADMIN_PASSWORD=<local> <PREFIXE>_SERVICE_CERTIFICAT=<certificat> (5 comptes de service, voir scripts/cles-services-test.sh) docker compose -f platform/services/identite/docker-compose.yml up -d
# Le mot de passe administrateur n'est jamais écrit dans le dépôt : il est lu dans l'environnement du poste.
# Console : http://127.0.0.1:8081 (accessible uniquement depuis la machine locale).
services:
  keycloak:
    # Version exacte : l'extension d'inscription (keycloak-extension/) est compilée pour elle.
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Définir KC_BOOTSTRAP_ADMIN_PASSWORD dans l'environnement local}
      # Certificats publics des comptes de service (private_key_jwt, ADR-0016), injectés dans le royaume à
      # l'import. Obligatoires : sans valeur, Keycloak garderait le texte « ${…} ». Aucune clé privée ici.
      IDENTITE_SERVICE_CERTIFICAT: ${IDENTITE_SERVICE_CERTIFICAT:?Définir IDENTITE_SERVICE_CERTIFICAT dans l'environnement local}
      TELECONSULTATION_SERVICE_CERTIFICAT: ${TELECONSULTATION_SERVICE_CERTIFICAT:?Définir TELECONSULTATION_SERVICE_CERTIFICAT dans l'environnement local}
      NOTIFICATIONS_SERVICE_CERTIFICAT: ${NOTIFICATIONS_SERVICE_CERTIFICAT:?Définir NOTIFICATIONS_SERVICE_CERTIFICAT dans l'environnement local}
      CONSULTATION_SERVICE_CERTIFICAT: ${CONSULTATION_SERVICE_CERTIFICAT:?Définir CONSULTATION_SERVICE_CERTIFICAT dans l'environnement local}
      INVITATIONS_SERVICE_CERTIFICAT: ${INVITATIONS_SERVICE_CERTIFICAT:?Définir INVITATIONS_SERVICE_CERTIFICAT dans l'environnement local}
      DOCUMENTS_SERVICE_CERTIFICAT: ${DOCUMENTS_SERVICE_CERTIFICAT:?Définir DOCUMENTS_SERVICE_CERTIFICAT dans l'environnement local}
      # Revue ASVS n°1 (C5) : TLS exigé hors réseau privé en local ; « all » en production.
      MBOLO_KEYCLOAK_SSL_REQUIRED: ${MBOLO_KEYCLOAK_SSL_REQUIRED:-external}
      # Extension d'inscription (ADR-0014) : adresse du service des invitations, vue depuis le conteneur.
      KC_SPI_FORM_ACTION_MBOLO_CODE_INVITATION_INVITATIONS_URL: ${INVITATIONS_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3006/}
      # Récupération du compte (ADR-0021) : même service, étape du flux « identifiants oubliés ».
      KC_SPI_AUTHENTICATOR_MBOLO_CODE_RECUPERATION_INVITATIONS_URL: ${INVITATIONS_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3006/}
      # Double authentification des patients (ADR-0022) : envoi du code SMS par le service des notifications.
      KC_SPI_AUTHENTICATOR_MBOLO_CODE_SMS_NOTIFICATIONS_URL: ${NOTIFICATIONS_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3004/}
      # Validation du numéro saisi à « Mon identité » (revue ASVS n°2, C8) : même service.
      KC_SPI_REQUIRED_ACTION_MBOLO_IDENTITE_PATIENT_NOTIFICATIONS_URL: ${NOTIFICATIONS_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3004/}
      # Identité saisie après l'inscription : dossier créé par la passerelle (ADR-0014).
      KC_SPI_REQUIRED_ACTION_MBOLO_IDENTITE_PATIENT_DOSSIER_URL: ${PASSERELLE_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3002/fhir/}
      KC_SPI_REQUIRED_ACTION_MBOLO_IDENTITE_PATIENT_ENVIRONNEMENT: dev
      # Changement du numéro par le patient (ADR-0023) : dossier (numéro seul) et notifications (codes, alerte).
      KC_SPI_REQUIRED_ACTION_MBOLO_CHANGER_TELEPHONE_DOSSIER_URL: ${PASSERELLE_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3002/fhir/}
      KC_SPI_REQUIRED_ACTION_MBOLO_CHANGER_TELEPHONE_NOTIFICATIONS_URL: ${NOTIFICATIONS_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3004/}
      # Téléphone perdu (ADR-0023) : code au nouveau numéro, puis demande au service documents.
      KC_SPI_REQUIRED_ACTION_MBOLO_TELEPHONE_PERDU_NOTIFICATIONS_URL: ${NOTIFICATIONS_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3004/}
      KC_SPI_REQUIRED_ACTION_MBOLO_TELEPHONE_PERDU_DOCUMENTS_URL: ${DOCUMENTS_URL_DEPUIS_KEYCLOAK:-http://host.docker.internal:3007/}
      # Système du numéro d'assurance maladie nationale du pays déployé (Gabon : CNAMGS) [FICTIF en dev].
      KC_SPI_REQUIRED_ACTION_MBOLO_IDENTITE_PATIENT_IDENTIFIANT_ASSURANCE_SYSTEME: ${IDENTIFIANT_ASSURANCE_SYSTEME:-https://mbolo-sante.example/fhir/identifiant/ga/assurance-maladie}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./keycloak/realm-mbolo.json:/opt/keycloak/data/import/realm-mbolo.json:ro
      # Construire d'abord : mvn -f platform/services/identite/keycloak-extension/pom.xml package
      - ./keycloak-extension/target/mbolo-keycloak-inscription.jar:/opt/keycloak/providers/mbolo-keycloak-inscription.jar:ro
