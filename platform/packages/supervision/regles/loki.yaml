# Fichier généré depuis platform/packages/supervision/src/regles.ts — ne pas modifier à la main.
# pnpm --filter @mbolo/supervision generer
groups:
  - name: "mbolo-securite"
    interval: "1m"
    rules:
      - alert: "ConsultationsPhotosAnormales"
        expr: "sum by (contexte_sujet) (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"consultation-photo\" [1h])) > 60"
        labels:
          gravite: "critique"
          destinataire: "responsable-securite"
          alerte: "consultation-photo"
        annotations:
          resume: "Plus de 60 photos d'identité ouvertes en une heure par un même vérificateur."
          conduite: "Plan d'incident « fuite de photos d'identité » : vérifier les traces, retirer le rôle verification-identite si besoin."
      - alert: "BrisDeGlace"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"bris-de-glace\" [5m])) > 0"
        labels:
          gravite: "normale"
          destinataire: "revue-acces"
          alerte: "bris-de-glace"
        annotations:
          resume: "Accès d'urgence à un dossier : revue humaine sous 24 h."
          conduite: "Espace de revue des bris de glace (rôle revue-acces)."
      - alert: "AccesRefusesEnRafale"
        expr: "sum by (contexte_sujet, contexte_client) (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"acces-refuse\" [5m])) > 20"
        labels:
          gravite: "critique"
          destinataire: "responsable-securite"
          alerte: "acces-refuse"
        annotations:
          resume: "Plus de 20 refus d’accès au dossier en 5 minutes pour un même compte ou service."
          conduite: "Vérifier le compte ; le désactiver dans Keycloak en cas de tentative d’intrusion."
      - alert: "CodesRecuperationEnSerie"
        expr: "sum by (contexte_par) (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"code-recuperation\" [1h])) > 5"
        labels:
          gravite: "critique"
          destinataire: "responsable-securite"
          alerte: "code-recuperation"
        annotations:
          resume: "Plus de 5 codes de récupération de compte remis en une heure par un même membre de l’équipe."
          conduite: "Vérifier les dossiers concernés et les traces ; retirer le rôle assistance-patient si besoin, prévenir les patients."
      - alert: "CodesConnexionBloques"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"code-connexion-bloque\" [1h])) > 0"
        labels:
          gravite: "normale"
          destinataire: "responsable-securite"
          alerte: "code-connexion-bloque"
        annotations:
          resume: "Un dossier a demandé plus de 10 codes de connexion par SMS en une heure : envois bloqués."
          conduite: "Retrouver le dossier dans le journal (alerte code-connexion-bloque) ; rappeler le patient au numéro de son dossier (équipe assistance-patient) : s’il n’a rien demandé, son mot de passe est connu, faire changer le mot de passe (ADR-0021)."
      - alert: "NumerosChangesEnSerie"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"numero-change\" [1h])) > 5"
        labels:
          gravite: "critique"
          destinataire: "responsable-securite"
          alerte: "numero-change"
        annotations:
          resume: "Plus de 5 numéros de téléphone de patients changés en une heure."
          conduite: "Retrouver les dossiers dans le journal (alerte numero-change) ; faire rappeler les patients par l’équipe assistance-patient à leur ancien numéro ; suspendre le changement de numéro si c’est une attaque."
      - alert: "EssaisBloquesEnRafale"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"essais-bloques\" [15m])) > 20"
        labels:
          gravite: "critique"
          destinataire: "responsable-securite"
          alerte: "essais-bloques"
        annotations:
          resume: "Plus de 20 essais de code d’invitation ou de date de naissance bloqués en 15 minutes."
          conduite: "Vérifier les adresses et les comptes en cause ; suspendre les invitations ou l’assistance si c’est une attaque."
  - name: "mbolo-exploitation"
    interval: "1m"
    rules:
      - alert: "CodesConnexionEnRafale"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"code-connexion\" [15m])) > 200"
        labels:
          gravite: "critique"
          destinataire: "astreinte-technique"
          alerte: "code-connexion"
        annotations:
          resume: "Plus de 200 codes de connexion envoyés par SMS en 15 minutes."
          conduite: "Pompage de SMS possible : vérifier les dossiers et les adresses en cause ; plafonner les envois chez le fournisseur SMS si besoin."
      - alert: "LimitesAppelsDepassees"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"limite-appels\" [5m])) > 100"
        labels:
          gravite: "normale"
          destinataire: "astreinte-technique"
          alerte: "limite-appels"
        annotations:
          resume: "Plus de 100 requêtes refusées par les limites d’appels en 5 minutes."
          conduite: "Chercher l’adresse en cause ; bloquer au pare-feu si c’est une attaque."
      - alert: "ErreursServeur"
        expr: "sum by (service) (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"erreur-serveur\" [5m])) > 10"
        labels:
          gravite: "normale"
          destinataire: "astreinte-technique"
          alerte: "erreur-serveur"
        annotations:
          resume: "Plus de 10 erreurs internes en 5 minutes sur un service."
          conduite: "Lire le journal du service ; vérifier le dossier médical et la base."
      - alert: "RemboursementsAValider"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"remboursement-a-valider\" [1h])) > 0"
        labels:
          gravite: "normale"
          destinataire: "validation-remboursement"
          alerte: "remboursement-a-valider"
        annotations:
          resume: "Un paiement a été reçu pour un rendez-vous annulé : remboursement à valider."
          conduite: "Espace des remboursements (rôle validation-remboursement) : valider ou refuser selon les règles du porteur de projet."
      - alert: "ProfessionnelsAEcheance"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"professionnel-echeance\" [1d])) > 0"
        labels:
          gravite: "normale"
          destinataire: "verification-professionnels"
          alerte: "professionnel-echeance"
        annotations:
          resume: "L’inscription d’un professionnel vérifié arrive à échéance (dans 30, 7 ou 1 jours)."
          conduite: "Demander une attestation à jour et revérifier à la source avant l’échéance ; sinon il sortira de l’annuaire et perdra l’accès aux patients."
      - alert: "ProfessionnelsEchus"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"professionnel-echu\" [1d])) > 0"
        labels:
          gravite: "normale"
          destinataire: "verification-professionnels"
          alerte: "professionnel-echu"
        annotations:
          resume: "Un professionnel est arrivé à échéance sans nouvelle vérification : fiche remise « à vérifier »."
          conduite: "Le revérifier depuis « Professionnels à vérifier » ; ses rendez-vous à venir sont à signaler aux patients par l’équipe."
      - alert: "RendezVousAReprendre"
        expr: "sum (count_over_time({app=\"mbolo-sante\"} | json | contexte_alerte=\"rendez-vous-a-reprendre\" [1h])) > 0"
        labels:
          gravite: "normale"
          destinataire: "assistance-patient"
          alerte: "rendez-vous-a-reprendre"
        annotations:
          resume: "Des rendez-vous à venir sont pris chez un professionnel suspendu ou à revérifier."
          conduite: "Ouvrir la liste des rendez-vous à reprendre, appeler chaque patient au numéro de son dossier et lui proposer un autre médecin ; rien n’est annulé automatiquement."
